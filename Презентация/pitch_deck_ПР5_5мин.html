<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ПР5 · Роснефть — pitch deck за 5 минут</title>
<style>
:root{--bg:#071016;--panel:#10232c;--panel2:#152f3a;--line:#315662;--text:#f1ecdf;--muted:#b3c1c5;--teal:#18d8c2;--green:#65df90;--orange:#ffae35;--red:#ff6d65;--blue:#78a7ff;--pink:#ff5ca8;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;background:radial-gradient(1000px 600px at 80% -10%,#123d43 0,transparent 60%),linear-gradient(145deg,#071016,#0c1820 60%,#111c2c);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid var(--orange);outline-offset:3px}.top{position:fixed;z-index:20;inset:0 0 auto;background:#071016e8;border-bottom:1px solid var(--line);backdrop-filter:blur(14px);padding:10px 18px;display:flex;gap:14px;align-items:center}.brand{font-weight:800;letter-spacing:.03em;color:var(--teal)}.top small{color:var(--muted)}.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 11px;cursor:pointer}.btn:hover{border-color:var(--teal);background:#173743}.btn.primary{background:linear-gradient(120deg,var(--teal),#82e85e);color:#06201e;border:0;font-weight:700}.timer{font:600 14px var(--mono);padding:7px 10px;border:1px solid var(--orange);border-radius:8px;color:var(--orange)}main{padding:95px 24px 70px;max-width:1320px;margin:auto}.stage{min-height:650px;display:grid;place-items:center}.slide{width:min(1120px,100%);animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.eyebrow{font:12px var(--mono);color:var(--orange);letter-spacing:.16em;text-transform:uppercase}.slide h1{font-size:clamp(42px,7vw,86px);line-height:.95;margin:14px 0 24px;max-width:1000px}.slide h2{font-size:clamp(34px,5vw,64px);line-height:1;margin:10px 0 26px;color:var(--teal)}.slide h3{color:var(--orange);margin-top:24px}.subtitle{font-size:clamp(19px,2.4vw,30px);color:var(--muted);max-width:850px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}.card{background:linear-gradient(150deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 15px 40px #0005}.card .label{color:var(--muted);font:11px var(--mono);text-transform:uppercase;letter-spacing:.12em}.card .big{font:700 34px var(--mono);color:var(--teal);margin-top:7px}.card .hint{color:var(--muted);font-size:13px;margin-top:6px}.source{border:0;border-bottom:1px dashed var(--teal);padding:0 2px;background:transparent;cursor:pointer;color:inherit}.source:hover{color:var(--teal);background:#18d8c21c}.source-panel{display:none;margin:10px 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:#08161c;color:var(--muted);font-size:14px}.source-panel.on{display:block}.source-panel b{color:var(--teal)}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 8px;margin:2px;color:var(--muted);font-size:12px}.tag.fact{border-color:#3ddc84;color:#bff5d2}.tag.game{border-color:var(--orange);color:#ffe1a7}.tag.calc{border-color:#a06bff;color:#e2d4ff}.tag.assume{border-color:var(--red);color:#ffd1ce}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:24px 0}.flow span{padding:12px 15px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}.flow i{color:var(--orange);font-style:normal;font-size:25px}.callout{border-left:4px solid var(--teal);background:#0d2a31;padding:14px 18px;margin:18px 0}.callout.warn{border-color:var(--orange);background:#2b2113}.callout.bad{border-color:var(--red);background:#2b1719}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--teal);font-size:12px;text-transform:uppercase;background:#0b1a21}.mono{font-family:var(--mono)}.waterfall{display:grid;gap:8px;max-width:760px}.wf{display:grid;grid-template-columns:240px 1fr 120px;gap:10px;align-items:center}.bar{height:18px;border-radius:5px;background:linear-gradient(90deg,var(--teal),var(--green))}.bar.neg{background:repeating-linear-gradient(120deg,#8d2e29 0 7px,var(--red) 7px 14px)}.bar.orange{background:linear-gradient(90deg,var(--orange),#ffe164)}.wf .v{text-align:right;font:14px var(--mono)}.demo{display:grid;grid-template-columns:250px 1fr;gap:16px}.demo-nav{display:grid;gap:8px}.demo-nav button{text-align:left}.demo-nav button.active{border-color:var(--teal);background:#18424a}.demo-output{min-height:300px}.meter{height:15px;background:#071116;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:12px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--orange),var(--green));transition:width .3s}.notes{position:fixed;z-index:30;left:0;right:0;bottom:0;background:#071016f5;border-top:1px solid var(--line);padding:10px 20px;display:none;max-height:28vh;overflow:auto}.notes.on{display:block}.notes b{color:var(--teal)}.bottom{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:15px}.dots{display:flex;gap:6px}.dots button{width:10px;height:10px;padding:0;border-radius:50%;background:var(--line);border:0;cursor:pointer}.dots button.active{background:var(--teal);transform:scale(1.4)}.overview{display:none}.overview.on{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.overview .mini{min-height:150px;cursor:pointer}.hidden{display:none!important}@media(max-width:700px){main{padding:80px 13px 80px}.top{padding:9px 11px}.top small{display:none}.demo{grid-template-columns:1fr}.wf{grid-template-columns:1fr 1fr}.wf label{grid-column:1/-1}.slide h1{font-size:48px}}
</style>
</head>
<body>
<header class="top"><div class="brand">ПР5 · PITCH DECK</div><small>ПАО «НК «Роснефть» · 5 минут · решение, а не обещание</small><div class="top-right"><span class="timer" id="timer">05:00</span><button class="btn" id="notesBtn">Заметки</button><button class="btn" id="overviewBtn">Обзор</button><button class="btn primary" id="startBtn">Пуск</button></div></header>
<main><div class="stage"><article class="slide" id="slide"></article></div><section class="overview" id="overview"></section><div class="bottom"><button class="btn" id="prev">←</button><div class="dots" id="dots"></div><button class="btn primary" id="next">→</button></div></main>
<div class="notes" id="notes"><b>Speaker notes:</b> <span id="noteText"></span></div>
<script>
const REV=8236,REQ=18.75;
const sources={
'T-01':{title:'Выручка базового года',status:'fact',value:'8 236 млрд ₽ за 2025 год',source:'Паспорт; Общие документы/Отчет_2025.pdf; ИСТ-01, ИСТ-08',formula:'Базовое значение, не рассчитывается.',limit:'Точную страницу PDF нужно зафиксировать вручную.'},
'T-08':{title:'ИТ-бюджет',status:'assume',value:'66–82 млрд ₽, база 75 млрд ₽',source:'Последняя ПР1, А2 Т-08, П5-Н01',formula:'Оценка через 0,8–1,0% выручки.',limit:'Внутренний бюджет компании недоступен.'},
'T-09':{title:'Требуемое сокращение',status:'calc',value:'18,75 млрд ₽',source:'Сценарий 51; А2 Т-09',formula:'75 × 25% = 18,75 млрд ₽.',limit:'Зависит от допущения о базе ИТ-бюджета.'},
'T-37':{title:'Выручка группы новых покупателей',status:'assume',value:'10,5 млрд ₽',source:'А2 Т-37; П5-Д05; ИСТ-31',formula:'Середина базового диапазона 9–12 млрд ₽ из воронки спроса.',limit:'Воронка и средний объём покупателя не измерены.'},
'T-40':{title:'Прибыль У1',status:'calc',value:'0,95 млрд ₽',source:'А2 Т-40; ИСТ-32',formula:'10,5 × 9% = 0,945 ≈ 0,95 млрд ₽.',limit:'Прибыльность 9% является допущением.'},
'T-51':{title:'Эффект У2',status:'calc',value:'0,07 млрд ₽',source:'А2 Т-51; П5-Р08; ИСТ-33',formula:'31,5 млн предотвращённых невозвратов + 40,3 млн стоимости денег = 71,8 млн ₽.',limit:'Компания не выдаёт банковские кредиты; речь идёт о коммерческой отсрочке платежа и дебиторской задолженности.'},
'T-57':{title:'Чистая экономия У3',status:'calc',value:'18,8 млрд ₽',source:'А2 Т-57; ИСТ-34',formula:'25,5 − 5,0 − 0,8 − 0,9 = 18,8 млрд ₽.',limit:'Все основные множители являются внутренними допущениями.'},
'T-65':{title:'Эффект У4',status:'calc',value:'0,30 млрд ₽',source:'А2 Т-65; П5-Р09; ИСТ-35',formula:'10% × 3,0 млрд ₽, базовая середина диапазона унификации.',limit:'Доля переделок 10% не измерена.'},
'T-70':{title:'Эффект У5',status:'assume',value:'0,05 млрд ₽',source:'А2 Т-70; ИСТ-36',formula:'0,50 − 10% × 4,5 = 0,05 млрд ₽.',limit:'Вероятность происшествия неизвестна.'},
'T-80':{title:'Реалистичная прибыль установившегося года',status:'calc',value:'15,87–17,17 млрд ₽',source:'А2 Т-80; ИСТ-38',formula:'Расчётная прибыль после поправок минус 1,3–2,6 млрд ₽ поведения людей.',limit:'Нижняя граница зависит от собственного суждения о поведении.'},
'T-90':{title:'Ожидание в пилоте',status:'calc',value:'118,1 млн ₽ на 100 заявок',source:'А2 Т-90; ИСТ-23',formula:'945 млн ₽ / 800 заявок × 100.',limit:'800 заявок и 945 млн ₽ являются модельными входами.'},
'T-91':{title:'Порог успеха пилота',status:'decision',value:'100 млн ₽ на 100 заявок',source:'А2 Т-91; П5-Д22; ИСТ-43',formula:'Управленческий порог установлен ниже ожидания 118,1 млн ₽.',limit:'Это условие решения, а не фактический результат.'},
'T-100':{title:'Готовность резервного варианта',status:'decision',value:'не менее 80%',source:'А2 Т-100; П5-Д26; ИСТ-12',formula:'Проверочный перечень: договор, безопасность, данные, права и план смены поставщика.',limit:'Фактическая готовность должна быть подтверждена документами.'}
};
const slides=[
{id:'s1',time:20,title:'Решение за 5 минут',subtitle:'Не масштабировать, а проверить',body:()=>`<p class="subtitle">Руководству предлагается утвердить шестимесячный пилот цифрового B2B-канала без предварительного масштабирования.</p><div class="grid"><div class="card"><span class="label">Выручка 2025</span><div class="big"><button class="source" data-id="T-01">8 236 млрд ₽</button></div><div class="hint">база модели</div></div><div class="card"><span class="label">ИТ-бюджет</span><div class="big"><button class="source" data-id="T-08">75 млрд ₽</button></div><div class="hint">допущение, не внутренний факт</div></div><div class="card"><span class="label">Задача собственника</span><div class="big"><button class="source" data-id="T-09">18,75 млрд ₽</button></div><div class="hint">сокращение на 25%</div></div><div class="card"><span class="label">Реалистичная прибыль</span><div class="big"><button class="source" data-id="T-80">15,87–17,17</button></div><div class="hint">установившийся год</div></div></div><div class="callout">Главный результат — не обещание эффекта, а управляемая проверка с порогом успеха и условиями остановки.</div>` ,notes:'Начните с управленческого решения. Сразу отделите реалистичную прибыль установившегося года от результата первого года и подчеркните, что ИТ-бюджет 75 млрд рублей является допущением.'},
{id:'s2',time:25,title:'Почему модель управления не выдерживает скорость и экономию',subtitle:'Один ресурс используется несколькими инициативами',body:()=>`<div class="flow"><span>Скорость подключения</span><i>+</i><span>Сокращение расходов</span><i>+</i><span>Защищённые сервисы</span></div><div class="grid"><div class="card"><span class="label">Коммерция</span><div class="big">5 дней</div><div class="hint">целевой срок для простого покупателя</div></div><div class="card"><span class="label">Финансы</span><div class="big">−25%</div><div class="hint">требование по ИТ-расходам</div></div><div class="card"><span class="label">Устойчивость</span><div class="big">30–90 дней</div><div class="hint">правило сверки изменений</div></div></div><div class="callout warn">Диагноз: ИТ остаётся партнёром бизнеса, но находится в управляемом кризисе приоритетов.</div>`,notes:'Объясните конфликт без технической терминологии. Коммерции нужна скорость, финансам нужна экономия, а производству и безопасности нужна предсказуемость и возможность вернуть изменение.'},
{id:'s3',time:45,title:'Пять улучшений: ПР2 → ПР3 → ПР5',subtitle:'Каждая мера обслуживает гипотезу и процесс',body:()=>`<table><thead><tr><th>№</th><th>Мера</th><th>Результат</th><th>Уверенность</th></tr></thead><tbody><tr><td>У1</td><td>Двухконтурный B2B-онбординг</td><td><button class="source" data-id="T-37">10,5 млрд ₽ выручки</button><br><button class="source" data-id="T-40">0,95 млрд ₽ прибыли</button></td><td>Средняя-низкая</td></tr><tr><td>У2</td><td>Контроль коммерческой дебиторской задолженности</td><td><button class="source" data-id="T-51">0,07 млрд ₽</button></td><td>Низкая</td></tr><tr><td>У3</td><td>Секвестр по реестру protected services</td><td><button class="source" data-id="T-57">18,8 млрд ₽ экономии</button></td><td>Низкая по входам</td></tr><tr><td>У4</td><td>Risk-based change control и read-only данные</td><td><button class="source" data-id="T-65">0,30 млрд ₽</button></td><td>Низкая</td></tr><tr><td>У5</td><td>Formal risk acceptance и decision log</td><td><button class="source" data-id="T-70">0,05 млрд ₽</button></td><td>Очень низкая</td></tr></tbody></table><div class="callout">У2 не является банковским кредитованием. Роснефть управляет коммерческой отсрочкой платежа и риском дебиторской задолженности при продаже товара.</div>`,notes:'У2 нужно объяснить особенно точно: компания не выдаёт банковские кредиты. Она продаёт товар с отсрочкой платежа и тем самым принимает коммерческий риск до получения денег.'},
{id:'s4',time:40,title:'Совместный эффект: 20,17 не равно итог программы',subtitle:'Нужно учитывать пересечения, узкое место и поведение',body:()=>`<div class="waterfall"><div class="wf"><label>Простая сумма прибыли</label><div class="bar" style="width:100%"></div><div class="v">20,17</div></div><div class="wf"><label>Пересечения</label><div class="bar neg" style="width:18%"></div><div class="v">−0,35</div></div><div class="wf"><label>Взаимное усиление</label><div class="bar" style="width:13%"></div><div class="v">+0,25</div></div><div class="wf"><label>Общее узкое место</label><div class="bar neg" style="width:48%"></div><div class="v">−1,35</div></div><div class="wf"><label>Незакрытые обязательства</label><div class="bar neg" style="width:14%"></div><div class="v">−0,25</div></div><div class="wf"><label>Расчётная прибыль</label><div class="bar orange" style="width:91%"></div><div class="v">18,47</div></div><div class="wf"><label>Поведение людей</label><div class="bar neg" style="width:42%"></div><div class="v">−1,3…−2,6</div></div><div class="wf"><label>Реалистичная прибыль</label><div class="bar" style="width:82%"></div><div class="v"><button class="source" data-id="T-80">15,87…17,17</button></div></div></div><div class="callout warn">Деньги и сроки учитываются отдельно: первый год ниже установившегося на 4,24 млрд ₽.</div>`,notes:'Покажите waterfall сверху вниз. Отдельно скажите, что общее узкое место в деньгах не отменяет критического пути в сроках.'},
{id:'s5',time:35,title:'Коридор: результат правдоподобен, но не гарантирован',subtitle:'Сравниваем не с желанием, а с отраслевым диапазоном',body:()=>`<div class="grid"><div class="card"><span class="label">Коридор набора</span><div class="big">0,2–1,0%</div><div class="hint">выручки компании</div></div><div class="card"><span class="label">Установившийся год</span><div class="big"><button class="source" data-id="T-80">0,19–0,21%</button></div><div class="hint">нижняя граница примерно на 0,60 млрд ниже порога</div></div><div class="card"><span class="label">Первый год</span><div class="big">0,14–0,16%</div><div class="hint">ниже коридора при любом сценарии</div></div></div><table><thead><tr><th>Мера</th><th>Сравнение</th><th>Вывод</th></tr></thead><tbody><tr><td>У1</td><td>0,13% выручки</td><td>в коридоре</td></tr><tr><td>У2</td><td>0,0009% выручки</td><td>ниже; окупаемость 26 месяцев</td></tr><tr><td>У3</td><td>25,1% ИТ-статьи</td><td>выше 1–5%; портфельная программа</td></tr><tr><td>У4</td><td>0,004% выручки</td><td>ниже; подготовительное</td></tr><tr><td>У5</td><td>0,0006% выручки</td><td>ниже; защитное</td></tr></tbody></table>`,notes:'Скажите, что нижняя граница реалистичной прибыли не дотягивает до коридора из-за поведения людей. Это сильнее, чем делать вид, что все сценарии одинаково успешны.'},
{id:'s6',time:40,title:'Пилот на денежном сегменте',subtitle:'Проверяем прибыль после возврата денег, а не скорость заявки',body:()=>`<div class="grid"><div class="card"><span class="label">Отбор клиента</span><div class="big">170 млн ₽</div><div class="hint">подтверждённый годовой потенциал</div></div><div class="card"><span class="label">Главная величина</span><div class="big"><button class="source" data-id="T-91">100 млн</button></div><div class="hint">прибыли на 100 заявок</div></div><div class="card"><span class="label">Ожидание</span><div class="big"><button class="source" data-id="T-90">118,1</button></div><div class="hint">млн ₽ на 100 заявок</div></div><div class="card"><span class="label">Длительность</span><div class="big">6 мес.</div><div class="hint">около 42 дней до денег</div></div></div><div class="flow"><span>Опытные регионы</span><i>vs</i><span>Контрольные регионы</span><i>→</i><span>Решение по порогу</span></div><div class="callout">Защитные метрики: прибыльность не ниже 8%, ухудшение возврата денег не более 10 дней, сложные случаи не более 50%, ноль критических происшествий.</div>`,notes:'Подчеркните, что пилот проверяет экономику, а не только скорость. Контрольная группа нужна для отделения эффекта канала от сезонности и общерыночных изменений.'},
{id:'s7',time:35,title:'Бюджет и окупаемость',subtitle:'Быстрая окупаемость не заменяет проверку канала',body:()=>`<div class="grid"><div class="card"><span class="label">Разовые затраты</span><div class="big">4,0 млрд ₽</div><div class="hint">базовая оценка, диапазон 2,4–6,0</div></div><div class="card"><span class="label">Постоянные затраты</span><div class="big">1,39 млрд ₽</div><div class="hint">в год</div></div><div class="card"><span class="label">Human contour</span><div class="big">0,30 млрд ₽</div><div class="hint">разово, отдельной строкой</div></div><div class="card"><span class="label">Окупаемость</span><div class="big">2,8–3,0</div><div class="hint">месяца в базовой конфигурации</div></div></div><div class="callout warn">Основная быстрая окупаемость обеспечивается секвестром ИТ-портфеля. Поэтому канал должен пройти собственный пилот.</div>`,notes:'Объясните правило против двойного счёта: поддержка канала уже вычтена из экономии, а часть постоянных расходов покрыта резервом управления.'},
{id:'s8',time:35,title:'Интерактивная демонстрация чувствительности',subtitle:'Один параметр может изменить решение',body:()=>`<div class="demo"><div class="demo-nav"><button class="btn active" data-demo="base">A · Эталон</button><button class="btn" data-demo="uni">B · Унификация 4,0 млрд</button><button class="btn" data-demo="dso">C · Возврат денег хуже 10 дней</button></div><div class="card demo-output" id="demoOutput"></div></div>`,notes:'Нажмите сценарий A, затем B и C. После каждого переключения проговорите, что именно меняется и какое управленческое действие следует за этим.'},
{id:'s9',time:25,title:'Управленческое решение',subtitle:'Утвердить проверку, а не обещание эффекта',body:()=>`<div class="grid"><div class="card"><span class="label">Утвердить 1</span><div class="big">Пилот</div><div class="hint">6 месяцев, денежный сегмент, контрольная группа, порог 100 млн ₽</div></div><div class="card"><span class="label">Утвердить 2</span><div class="big">Protected</div><div class="hint">реестр, принятие риска, human contour</div></div><div class="card"><span class="label">Утвердить 3</span><div class="big">22 стопа</div><div class="hint">масштабирование только после подтверждения</div></div></div><div class="callout">Финальная просьба: утвердить управляемую проверку с заранее известной ценой, ответственными и способом остановки.</div>`,notes:'Закончите не обещанием результата, а просьбой о решении: пилот, защищённый контур и условия остановки.'}
];
let i=0,started=false,seconds=300,notes=false,demo='base',timer=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function openSource(id){const r=sources[id]||{title:id,status:'assume',value:'Связанная запись',source:'Приложения А2–А4',formula:'См. полную трассировку в приложениях.',limit:'Проверка зависит от связанной записи.'};const labels={fact:'Открытый факт',game:'Условие игры',calc:'Расчёт по допущениям',assume:'Допущение / недоступный факт',decision:'Решение ПР5'};const panel=document.createElement('div');panel.className='source-panel on';panel.innerHTML=`<b>${esc(r.title)}</b><br><span class="tag ${esc(r.status)}">${esc(labels[r.status])}</span><br><strong>Значение:</strong> ${esc(r.value)}<br><strong>Источник:</strong> ${esc(r.source)}<br><strong>Формула:</strong> ${esc(r.formula)}<br><strong>Ограничение:</strong> ${esc(r.limit)}`;const active=document.querySelector('.source-panel.on');if(active)active.remove();eventTarget?.after(panel)}
let eventTarget=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const s=slides[i];$('#slide').innerHTML=`<div class="eyebrow">${s.time} · слайд ${i+1} / ${slides.length}</div><h1>${s.title}</h1><p class="subtitle">${s.subtitle}</p><div style="margin-top:28px">${s.body()}</div>`;$('#noteText').textContent=s.notes;$$('.source').forEach(b=>b.onclick=e=>{eventTarget=b;openSource(b.dataset.id)});if(i===7)bindDemo();$('#dots').innerHTML=slides.map((_,n)=>`<button class="${n===i?'active':''}" data-i="${n}" aria-label="Слайд ${n+1}"></button>`).join('');$$('#dots button').forEach(b=>b.onclick=()=>{i=+b.dataset.i;render()});}
function bindDemo(){$$('[data-demo]').forEach(b=>b.onclick=()=>{$$('[data-demo]').forEach(x=>x.classList.remove('active'));b.classList.add('active');demo=b.dataset.demo;const d={base:{title:'A · Эталон',v:'15,87–17,17 млрд ₽',status:'ПИЛОТ РАЗРЕШЁН, МАСШТАБИРОВАНИЕ ЗАПРЕЩЕНО',text:'Установившийся год находится на границе коридора. Можно проводить проверку на реальных покупателях при соблюдении порогов.'},uni:{title:'B · Унификация 4,0 млрд ₽',v:'17,3 млрд ₽ экономии',status:'ЗАДАЧА СОБСТВЕННИКА НЕ ВЫПОЛНЯЕТСЯ',text:'При росте бюджета унификации чистая экономия падает ниже 18,75 млрд ₽. Нужно добавить заморозку или передать решение правлению.'},dso:{title:'C · Возврат денег хуже 10 дней',v:'Быстрый путь ОСТАНОВИТЬ',status:'МАСШТАБИРОВАНИЕ ЗАПРЕЩЕНО',text:'Скорость подключения больше не считается преимуществом, если она создаёт чрезмерную коммерческую дебиторскую задолженность.'}}[demo];$('#demoOutput').innerHTML=`<span class="eyebrow">Сценарий чувствительности</span><h3>${d.title}</h3><div class="card"><div class="big">${d.v}</div><p>${d.text}</p><div class="tag calc">${d.status}</div></div>`})};
function start(){if(timer)return;started=true;timer=setInterval(()=>{seconds=Math.max(0,seconds-1);$('#timer').textContent=fmt(seconds);if(seconds===0)clearInterval(timer)},1000)}
$('#next').onclick=()=>{i=Math.min(slides.length-1,i+1);render()};$('#prev').onclick=()=>{i=Math.max(0,i-1);render()};$('#startBtn').onclick=()=>{start();render()};$('#notesBtn').onclick=()=>{$('#notes').classList.toggle('on');notes=!notes};$('#overviewBtn').onclick=()=>{$('#overview').classList.toggle('on');renderOverview()};
function renderOverview(){$('#overview').innerHTML=slides.map((s,n)=>`<div class="card mini" data-go="${n}"><span class="eyebrow">${s.time}</span><h3>${s.title}</h3><p>${s.subtitle}</p></div>`).join('');$$('[data-go]').forEach(b=>b.onclick=()=>{$('#overview').classList.remove('on');i=+b.dataset.go;render()})};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){$('#next').click();e.preventDefault()}if(e.key==='ArrowLeft'||e.key==='PageUp'){$('#prev').click();e.preventDefault()}if(e.key===' '){start();e.preventDefault()}if(e.key==='Escape'){$('#notes').classList.remove('on');$('#overview').classList.remove('on')}});
render();
</script></body></html>
